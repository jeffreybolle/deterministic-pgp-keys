[package]
name = "deterministic-pgp-keys"
version = "0.5.0"
edition = "2024"
authors = ["Jeffrey Bolle <jeffreybolle@gmail.com>"]
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/jeffreybolle/deterministic-pgp-keys"
description = "Generate PGP keys from a 12 word seed phrase"

[dependencies]
rand = "0.8"
bip39 = "2"
clap = { version = "4", features = ["derive"] }
anyhow = "1.0.65"
rpassword = "7.0"
rand_chacha = "0.3.1"
aes = "0.8"
base64 = "0.22"
bitfield = "0.17"
block-padding = "0.3"
blowfish = "0.9"
byteorder = "1.4"
cast5 = "0.11"
cfb-mode = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
cipher = "0.4"
crc24 = "0.1"
derive_builder = "0.20"
des = "0.8"
digest = "0.10"
generic-array = "0.14"
hex = "0.4"
log = "0.4.6"
md-5 = { version = "0.10", features = ["oid"] }
nom = "8"
num-derive = "0.4"
num-traits = "0.2.6"
ripemd = { version = "0.1", features = ["oid"] }
rsa = "0.9.10"
sha1 = { version = "0.10", features = ["oid"] }
sha2 = { version = "0.10", features = ["oid"] }
sha3 = { version = "0.10", features = ["oid"] }
signature = "2.2.0"
smallvec = "1.6.1"
thiserror = "2"
twofish = "0.7"
zeroize = { version = "1.8", features = ["zeroize_derive"] }
hkdf = "0.12"

[dependencies.ed25519-dalek]
version = "2.2.0"
default-features = false
features = ["std"]

[dependencies.flate2]
version = "1.0"
default-features = false
features = ["rust_backend"]

[dependencies.gperftools]
version = "0.2.0"
optional = true

[dependencies.num-bigint]
version = "0.8.6"
features = ["rand", "i128", "u64_digit", "prime", "zeroize"]
package = "num-bigint-dig"

[dependencies.x25519-dalek]
version = "2.0.1"
default-features = false
features = ["alloc", "static_secrets"]

[dev-dependencies]
glob = "0.3"
hex-literal = "0.3"
pretty_assertions = "1"
pretty_env_logger = "0.5"
rand_chacha = "0.3"
rand_xorshift = "0.3"
regex = "1.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
