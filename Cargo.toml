[package]
name = "deterministic-pgp-keys"
version = "0.5.0"
edition = "2021"
authors = ["Jeffrey Bolle <jeffreybolle@gmail.com>"]
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/jeffreybolle/deterministic-pgp-keys"
description = "Generate PGP keys from a 12 word seed phrase"

[dependencies]
rand = "0.8"
bip39 = "2"
clap = { version = "4", features = ["derive"] }
anyhow = "1.0.65"
rpassword = "7.0"
rand_chacha = "0.3.1"
aes = "0.8"
base64 = "0.22"
bitfield = "0.17"
block-padding = "0.3"
blowfish = "0.9"
byteorder = "^1.4"
cast5 = "0.11"
cfb-mode = "0.8"
chrono = { version = "^0.4", default-features = false, features = ["clock", "std"] }
cipher = "0.4"
crc24 = "^0.1"
derive_builder = "0.20"
des = "0.8"
digest = "0.10"
generic-array = "^0.14"
hex = "^0.4"
log = "0.4.6"
md-5 = "0.10"
nom = "^4.2"
num-derive = "0.4"
num-traits = "0.2.6"
ripemd = "0.1"
rsa = "0.6"
sha1 = "0.10"
sha2 = "0.10"
sha3 = "0.10"
signature = "1.3"
smallvec = "1.6.1"
thiserror = "2"
twofish = "0.7"
zeroize = { version = "1.8", features = ["zeroize_derive"] }
getrandom = { version = "0.2.3", optional = true }
hkdf = "0.12"

[dependencies.buf_redux]
version = "0.8.1"
default-features = false

[dependencies.ed25519-dalek]
version = "^1.0"
default-features = false
features = ["std", "u64_backend"]

[dependencies.flate2]
version = "^1.0"
default-features = false
features = ["rust_backend"]

[dependencies.gperftools]
version = "0.2.0"
optional = true

[dependencies.num-bigint]
version = "0.8.6"
features = ["rand", "i128", "u64_digit", "prime", "zeroize"]
package = "num-bigint-dig"

[dependencies.x25519-dalek]
version = "^1.0"
default-features = false
features = ["std", "u64_backend"]

[dev-dependencies]
glob = "^0.3"
hex-literal = "^0.3"
pretty_assertions = "1"
pretty_env_logger = "0.4"
rand_chacha = "0.3"
rand_xorshift = "0.3"
regex = "^1.5"
serde = { version = "^1.0", features = ["derive"] }
serde_json = "^1.0"
